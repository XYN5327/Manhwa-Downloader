# ─────────────────────────────────────────────
# Manga Downloader Config
# ─────────────────────────────────────────────

manga:
  # URL of the manga's main page (not a chapter page)
  url: "URL-HERE"

  # Chapter range — use null for open-ended
  # Examples:
  #   start: 1,  end: null   ->  download everything
  #   start: 62, end: null   ->  EP62 to the last episode
  #   start: 10, end: 20     ->  EP10 to EP20 (inclusive)
  #   start: null, end: 30   ->  EP1 to EP30
  chapter_start: null
  chapter_end: null

  # Referer header sent when downloading images.
  # null = automatic (the manga site's own address). Only set this if the
  # images are blocked (403) and you know the site that must be the referer.
  referer: null

output:
  # Folder where the CBZ files will be saved
  dir: "Manga-Download"

  # true = also keep the final page images in a "<chapter>_pages" folder
  keep_images: false

  # Write ComicInfo.xml (series / title / chapter number) into each CBZ.
  # Komga, Kavita, Mihon, etc. use it for nice names and ordering.
  comicinfo: true

  # ── Image format inside the CBZ ────────────
  #   webp     = smallest files (recommended). JPEG pages are re-encoded to
  #              WebP at `quality`; PNG pages become LOSSLESS WebP.
  #              A page is only replaced if the result is actually smaller.
  #   original = no re-encoding at all. Pixel-perfect, fastest, biggest.
  #   jpeg     = re-encode to JPEG (use only if your reader lacks WebP support)
  image_format: webp

  # Quality for lossy pages (webp / jpeg), 1-100.
  #   90 = visually identical to the source, good savings (recommended)
  #   85 = ~15% smaller again, still clean
  #   75 = smallest, slight softening on fine line-art / text
  quality: 90

  # WebP encoder effort, 0-6. 6 = slowest but smallest. Lower it (e.g. 4)
  # only if conversion is your bottleneck on a weak CPU.
  webp_method: 4

  # Maximum page width in pixels. 0 = never resize (best quality, default).
  # Resizing is lossy; set e.g. 1200 only if you want much smaller files.
  max_image_width: 0

browser:
  # Which browser to drive: "chrome" or "edge".
  # Windows already includes Microsoft Edge, so "edge" needs nothing installed.
  type: edge

  # OPTIONAL: full path to the browser program, for portable/scoop installs.
  # null = auto-detect. Example (scoop Chromium):
  #   binary_path: 'C:\Users\YOU\scoop\apps\chromium\current\chrome.exe'
  binary_path: null

  # OPTIONAL: full path to a driver you installed yourself (chromedriver.exe
  # or msedgedriver.exe). Must match the browser's major version.
  # null = Selenium downloads the right driver automatically.
  driver_path: null

  # true = run the browser in the background (no window)
  headless: true

  # Chrome only collects image URLs; the downloader fetches the images
  # itself. Blocking images in Chrome makes page loads much faster.
  # If a site shows no images with this on, the script automatically
  # retries with it off — or set this to false.
  block_images: true

  # Restart Chrome every N chapters to free memory (0 = never)
  restart_every: 25

speed:
  # Images downloaded in parallel (shared by all chapters in flight)
  #   8  = gentle      16 = default      32 = fast connection, tolerant site
  download_workers: 16

  # Chapters downloaded/converted at the same time while Chrome is already
  # collecting the next one. 2-4 is the sweet spot.
  parallel_chapters: 3

  # CPU processes used for WebP/JPEG conversion.
  # 0 = automatic (CPU threads minus 2)
  convert_workers: 0

  # Max seconds to wait for a chapter's images to appear (polls; doesn't
  # always wait the full time)
  page_wait: 3.0

  # Seconds to wait between scroll steps, only needed for lazy-loaded pages.
  # Increase if some pages are missing.
  scroll_wait: 0.4

  # Seconds to wait between chapters (be polite to the server)
  chapter_delay: 0.5
